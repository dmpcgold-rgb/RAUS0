name: RAUSO Android APK

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'scripts/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Use preinstalled Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          test -d "$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify UI and script syntax
        run: |
          node scripts/check-ui.cjs
          node tests/rauso-ui-regression.cjs
          node tests/rauso-event-discovery.cjs
          node tests/rauso-social-groupchat.cjs
          node tests/rauso-group-inbox.cjs
          node tests/rauso-group-unread.cjs

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: RAUSO-2.9.9-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Prepare direct-download APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/RAUSO-2.9.9-debug.apk

      - name: Publish downloadable GitHub pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rauso-debug-latest
          name: RAUSO 2.9.9 – Test APK
          body: |
            RAUSO 2.9.9 Android Debug APK.
            Dies ist eine Testversion, keine signierte Produktionsversion.
            Bei inkompatibler Android-Signatur ist ein direktes Update eventuell nicht möglich.
            Bitte vor einer eventuellen Neuinstallation Daten sichern.
          draft: false
          prerelease: true
          make_latest: false
          target_commitish: main
          files: dist/RAUSO-2.9.9-debug.apk
          fail_on_unmatched_files: true
