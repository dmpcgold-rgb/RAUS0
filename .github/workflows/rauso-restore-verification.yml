name: RAUSO restore verification
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download latest successful encrypted RAUSO backup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow rausо-encrypted-backup.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          test -n "$run_id"
          mkdir -p "$RUNNER_TEMP/restore-input"
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/restore-input"
      - name: Start isolated PostgreSQL
        run: |
          docker run -d --name rausodb-test -e POSTGRES_PASSWORD=test -p 127.0.0.1:55432:5432 postgres:17
          for i in $(seq 1 30); do
            docker exec rausodb-test pg_isready -U postgres && break
            sleep 1
          done
      - name: Verify isolated PostgreSQL
        run: docker exec rausodb-test psql -U postgres -tAc "SELECT 1" | grep -qx 1
