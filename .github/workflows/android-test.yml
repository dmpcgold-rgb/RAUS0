name: RAUSO Android Test-APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Verify RAUSO source assets
        run: |
          test -f app/src/main/assets/index.html
          test -f app/src/main/assets/app.js
          test -f app/src/main/assets/style.css
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: RAUSO-debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
