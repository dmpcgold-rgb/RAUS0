name: RAUSO Storage restore verification
on:
  workflow_dispatch:
    inputs:
      backup_run_id:
        description: 'Successful Storage backup run ID (leave empty for latest successful)'
        required: false
        type: string
permissions:
  contents: read
  actions: read
jobs:
  verify-storage-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download encrypted Storage backup
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_RUN_ID: ${{ inputs.backup_run_id }}
        run: |
          set -euo pipefail
          RUN_ID="$INPUT_RUN_ID"
          if [[ -z "$RUN_ID" ]]; then
            RUN_ID="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow rauso-storage-backup.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          fi
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo "::error::No successful Storage backup run found"; exit 1; }
          mkdir -p "$RUNNER_TEMP/rauso-storage-check"
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern 'rauso-storage-encrypted-*' --dir "$RUNNER_TEMP/rauso-storage-check"
          test "$(find "$RUNNER_TEMP/rauso-storage-check" -name storage.tar.gpg | wc -l)" -eq 1
          test "$(find "$RUNNER_TEMP/rauso-storage-check" -name SHA256SUMS | wc -l)" -eq 1
      - name: Verify encrypted archive and restored files
        env:
          BACKUP_PASSPHRASE: ${{ secrets.RAUSO_BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$BACKUP_PASSPHRASE"
          DIR="$(dirname "$(find "$RUNNER_TEMP/rauso-storage-check" -name storage.tar.gpg -print -quit)")"
          (cd "$DIR" && sha256sum --check SHA256SUMS)
          printf '%s' "$BACKUP_PASSPHRASE" > "$RUNNER_TEMP/rauso-storage-check-passphrase"
          trap 'rm -f "$RUNNER_TEMP/rauso-storage-restored.tar" "$RUNNER_TEMP/rauso-storage-check-passphrase"' EXIT
          gpg --batch --yes --pinentry-mode loopback --quiet --decrypt \
            --passphrase-file "$RUNNER_TEMP/rauso-storage-check-passphrase" \
            --output "$RUNNER_TEMP/rauso-storage-restored.tar" "$DIR/storage.tar.gpg"
          python3 scripts/verify_rauso_storage.py "$RUNNER_TEMP/rauso-storage-restored.tar"
