name: RAUSO restore smoke test
on:
  workflow_dispatch:
    inputs:
      backup_run_id:
        description: Successful backup workflow run ID
        required: true
permissions:
  contents: read
  actions: read
jobs:
  restore-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fetch encrypted backup artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.backup_run_id }}
        run: |
          mkdir -p "$RUNNER_TEMP/rauso-restore"
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern 'rausodb-encrypted-*' --dir "$RUNNER_TEMP/rauso-restore"
      - name: Check artifact integrity
        run: |
          set -euo pipefail
          find "$RUNNER_TEMP/rauso-restore" -name SHA256SUMS -execdir sha256sum --check SHA256SUMS \;
      - name: Test decryptability
        env:
          BACKUP_PASSPHRASE: ${{ secrets.RAUSO_BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          test -n "$BACKUP_PASSPHRASE"
          FILE="$(find "$RUNNER_TEMP/rauso-restore" -name rauso.dump.gpg | head -n 1)"
          test -f "$FILE"
          printf '%s' "$BACKUP_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --decrypt "$FILE" > "$RUNNER_TEMP/rauso-restored.dump"
          test -s "$RUNNER_TEMP/rauso-restored.dump"
      - name: Restore public tables in disposable PostgreSQL
        run: |
          set -euo pipefail
          docker run --detach --name rausodb-smoketest --env POSTGRES_PASSWORD=temporary-test-password postgres:17
          trap 'docker rm --force rausodb-smoketest >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 30); do
            docker exec rausodb-smoketest pg_isready -U postgres >/dev/null 2>&1 && break
            sleep 1
          done
          docker cp "$RUNNER_TEMP/rauso-restored.dump" rausodb-smoketest:/tmp/backup.dump
          docker exec rausodb-smoketest psql -v ON_ERROR_STOP=1 -U postgres -c 'CREATE SCHEMA IF NOT EXISTS auth; CREATE SCHEMA IF NOT EXISTS extensions;'
          # Restore public table definitions and data only. Post-data triggers and
          # foreign keys depend on Supabase-managed private/auth objects and are
          # deliberately excluded from this isolated public-data smoke test.
          docker exec rausodb-smoketest pg_restore -U postgres -d postgres --schema=public --section=pre-data --no-owner --no-acl --exit-on-error /tmp/backup.dump
          docker exec rausodb-smoketest pg_restore -U postgres -d postgres --schema=public --section=data --no-owner --no-acl --exit-on-error /tmp/backup.dump
          docker exec rausodb-smoketest psql -v ON_ERROR_STOP=1 -U postgres -tAc "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='public' AND table_name IN ('rauso_profiles','rauso_outings','rauso_messages','rauso_friendships')" | grep -qx 4
